name: River Club
on:
  push:
    paths: ['texas-holdem/**', '.github/workflows/texas-holdem.yml']
  pull_request:
    paths: ['texas-holdem/**', '.github/workflows/texas-holdem.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: texas-holdem
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: texas-holdem/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: texas-holdem/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: river-web
          path: texas-holdem/dist
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: texas-holdem/package-lock.json
      - run: npm ci
      - run: npm run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: river-${{ matrix.os }}
          path: |
            texas-holdem/release/*.dmg
            texas-holdem/release/*.exe
            texas-holdem/release/*.AppImage
            texas-holdem/release/*.deb
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: river-android-debug
          path: texas-holdem/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ios:simulator
      - run: ditto -c -k --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app build/RiverClub-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: river-ios-simulator
          path: texas-holdem/build/RiverClub-iOS-simulator.zip
