services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    expose:
      - "3001"
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
